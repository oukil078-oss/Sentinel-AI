version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: sentinel-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: sentinel-backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:postgrespassword@db:5432/postgres
      JWT_SECRET: default_local_jwt_secret_key_1234567890
      ADMIN_EMAIL: analyst@sentinel.ai
      ADMIN_PASSWORD: Sentinel2026!
      FRONTEND_URL: http://localhost:3000
    depends_on:
      - db
    volumes:
      - ./backend/models_cache:/app/models_cache
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: sentinel-frontend
    ports:
      - "3000:3000"
    environment:
      - VITE_BACKEND_URL=http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    restart: unless-stopped

  adminer:
    image: adminer
    container_name: sentinel-adminer
    ports:
      - "8080:8080"
    depends_on:
      - db
    restart: unless-stopped

volumes:
  pgdata:
